# Local development stack. The credentials below are throwaway defaults for a
# laptop that only listens on localhost; change them (and stop exposing the
# ports) before running this on any host reachable from the internet.
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: squeeze
      POSTGRES_PASSWORD: squeeze
      POSTGRES_DB: squeeze
    ports: ["5432:5432"]
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squeeze"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: squeeze
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.data/grafana:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # P10: the application itself. Build context is the repo root (one level
  # up from this file). Runtime state and the parquet cache live on ./data;
  # credentials come from ./.env; the unauthenticated /metrics + /health
  # endpoint is reachable only on the compose network (not published).
  squeeze-hunter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["squeeze-hunter", "paper"]
    env_file:
      - ../.env
    environment:
      SH_MONITOR__HTTP_HOST: 0.0.0.0
      SH_MONITOR__HTTP_PORT: "8080"
      IBKR_HOST: ib-gateway
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      - ib-gateway
      - prometheus
    restart: unless-stopped

  ib-gateway:
    build:
      context: .
      dockerfile: ib-gateway.dockerfile
    environment:
      TWS_USERID:    ${IBKR_USERID}
      TWS_PASSWORD:  ${IBKR_PASSWORD}
      TRADING_MODE:  paper
    ports:
      - "7497:7497"   # paper TWS / API
      - "5901:5900"   # VNC for debugging
    restart: unless-stopped
