score:
  threshold: 8.0
  # Classifier cutoffs (score/classifier.py). A = z[f1]+z[f3], B = z[f4]+z[f5].
  # CAR: A >= strong and B < mixed_floor (GME mirrors); Mixed: both >= mixed_floor.
  setup_thresholds:
    strong: 4.0
    mixed_floor: 3.0
  weights:
    f1_si_pct: 2.0
    f2_days_to_cover: 1.0
    f3_earnings_reaction: 2.0
    # R8.S-C3: f4 weight is intentionally 0.0 until a real Reddit baseline
    # cache exists. RedditProvider._compute_baseline_30d returns None today
    # so the factor is NaN for every ticker → cross_sectional_z drops them
    # → z=0 universally → multiplying by 1.5 was misleading. Restore to 1.5
    # when a nightly cached-count store is wired in.
    f4_wsb_mention: 0.0
    # f5 also returns 0 until the option-chain ingest job exists (Phase 4).
    # The weight stays at 1.5 so a future job activation flips it on.
    f5_call_oi_velocity: 1.5
    f6_bollinger_breakout: 1.0
    f7_volume_spike: 1.0
risk:
  kelly_fraction: 0.20
  position_cap: 0.08
  max_positions: 6
  max_new_per_day: 3
  max_gross_exposure: 0.90
  # Killswitch: rolling-30d max drawdown magnitude that halts new entries
  # (positive here; code negates it). The other four arms are code constants.
  monthly_drawdown_kill: 0.10
  # Kelly shrinkage: observed stats get weight n / (n + bayes_prior_n).
  bayes_prior_n: 30
stops:
  hard_stop: -0.12
  # R9.1: trailing magnitudes are stored as negative thresholds (-0.20 = exit
  # when 20% below the peak). Code applies abs() before evaluate_stops; the
  # YAML value is the source of truth for the "one config file" rule.
  trailing_car: -0.20
  trailing_gme: -0.25
  trailing_mixed: -0.22
  time_stop_days: 21
  # Signal decay = (entry_score - current_score) / entry_score. Halve once at
  # >= signal_decay_halve, exit at >= signal_decay_exit.
  signal_decay_halve: 0.50
  signal_decay_exit: 0.75
universe:
  min_market_cap: 200000000
  max_market_cap: 10000000000
  min_price: 5.0
  min_days_listed: 30
data:
  # R11: FINRA disseminates a settlement-date short-interest report ~8 US
  # business days later. The backtest reveals each SI record this many business
  # days after its settlement date so it can't act on short interest before it
  # was public (look-ahead bias). 0 = reveal on the settlement date (legacy).
  finra_publication_lag_bdays: 8
backtest:
  # Gate 1 "captured-the-event" case set (design spec §5, exactly 8 events).
  # A buy within [date - 5 calendar days, date + 1 day] captures the event;
  # >= 5 of 8 must be captured across ALL out-of-sample windows (test windows
  # + holdout), so leave no gaps between windows. Dates are the largest
  # close-to-close move in the month the spec names, read from the cached
  # bars. TUP has no bars (delisted) and can never be captured — kept so the
  # denominator stays 8. The CAR anchor is 2021-11-02 (+108%); the spec's
  # "Aug 2022" has no event in the data (max +5.4% that month).
  validation_events:
    - { ticker: GME, date: 2021-01-27 }   # GME-type anchor
    - { ticker: CAR, date: 2021-11-02 }   # CAR-type anchor
    - { ticker: BBBY, date: 2022-08-16 }  # Mixed anchor (Ryan Cohen)
    - { ticker: GME, date: 2024-05-13 }   # Roaring Kitty return
    - { ticker: TUP, date: 2024-05-14 }   # meme rally (no bars on disk)
    - { ticker: OKLO, date: 2025-01-03 }  # Mixed
    - { ticker: HTZ, date: 2025-04-16 }   # CAR-type
    - { ticker: CAR, date: 2026-04-13 }   # CAR-type, freshest
monitor:
  # /metrics (Prometheus text) and /health (JSON, 503 while unhealthy or the
  # killswitch is active). 0 disables. The endpoint has NO authentication and
  # exposes equity, position count and killswitch state, so it binds to
  # loopback. Set http_host to 0.0.0.0 only when the Prometheus container
  # (docker/prometheus.yml scrapes host.docker.internal:8080) must reach it
  # and the host firewall blocks the port from the outside.
  http_port: 8080
  http_host: 127.0.0.1
